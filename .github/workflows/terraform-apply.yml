name: "Terraform Apply"

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VAR_location: ${{ vars.LOCATION }}
  TF_VAR_resource_group_name: ${{ vars.RESOURCE_GROUP_NAME }}
  TF_VAR_swa_name: ${{ vars.SWA_NAME }}
  TF_VAR_swa_sku: ${{ vars.SWA_SKU }}
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_PASSWORD }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_PASSWORD }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Create Backend Infrastructure (Idempotent)
        id: setup_backend
        shell: bash
        run: |
          RG_NAME="tfstate-rg"
          STORAGE_ACCOUNT_NAME="tfstatewebpersonal2026"
          CONTAINER_NAME="tfstate"

          az group create --name $RG_NAME --location "${{ vars.LOCATION }}" --query id -o tsv > /dev/null

          AVAILABILITY=$(az storage account check-name --name $STORAGE_ACCOUNT_NAME --query nameAvailable -o tsv)
          if [ "$AVAILABILITY" == "true" ]; then
            az storage account create \
              --name $STORAGE_ACCOUNT_NAME \
              --resource-group $RG_NAME \
              --location "${{ vars.LOCATION }}" \
              --sku Standard_LRS
          fi

          az storage container create \
            --name $CONTAINER_NAME \
            --account-name $STORAGE_ACCOUNT_NAME \
            --auth-mode key > /dev/null

          echo "rg=$RG_NAME" >> $GITHUB_OUTPUT
          echo "storage=$STORAGE_ACCOUNT_NAME" >> $GITHUB_OUTPUT
          echo "container=$CONTAINER_NAME" >> $GITHUB_OUTPUT

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group=${{ steps.setup_backend.outputs.rg }}" \
            -backend-config="storage_account=${{ steps.setup_backend.outputs.storage }}" \
            -backend-config="container=${{ steps.setup_backend.outputs.container }}" \
            -backend-config="key=terraform.tfstate"

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

