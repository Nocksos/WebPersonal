name: "Terraform Apply"

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  TF_VAR_location: ${{ vars.LOCATION }}
  TF_VAR_resource_group_name: ${{ vars.RESOURCE_GROUP_NAME }}
  TF_VAR_swa_name: ${{ vars.SWA_NAME }}
  TF_VAR_swa_sku: ${{ vars.SWA_SKU }}
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"

jobs:
  terraform:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_CLIENT_PASSWORD }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Create Backend Infrastructure (Idempotent)
        id: setup_backend
        shell: bash
        run: |
          echo "=== Registering Resource Providers ==="
          az provider register --namespace Microsoft.Storage > /dev/null 2>&1 || true
          az provider register --namespace Microsoft.Web > /dev/null 2>&1 || true

          LOCATION_VAL="${{ vars.LOCATION }}"
          if [ -z "$LOCATION_VAL" ]; then
            LOCATION_VAL="westeurope"
          fi

          RG_NAME="tfstate-rg"
          STORAGE_ACCOUNT_NAME="tfstatewebpersonal2026"
          CONTAINER_NAME="tfstate"

          az group create --name $RG_NAME --location "$LOCATION_VAL"

          az storage account create \
            --name $STORAGE_ACCOUNT_NAME \
            --resource-group $RG_NAME \
            --location "$LOCATION_VAL" \
            --sku Standard_LRS

          ACCOUNT_KEY=$(az storage account keys list --resource-group $RG_NAME --account-name $STORAGE_ACCOUNT_NAME --query "[0].value" -o tsv)

          az storage container create \
            --name $CONTAINER_NAME \
            --account-name $STORAGE_ACCOUNT_NAME \
            --account-key "$ACCOUNT_KEY"

          echo "rg=$RG_NAME" >> $GITHUB_OUTPUT
          echo "storage=$STORAGE_ACCOUNT_NAME" >> $GITHUB_OUTPUT
          echo "container=$CONTAINER_NAME" >> $GITHUB_OUTPUT

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="resource_group=${{ steps.setup_backend.outputs.rg }}" \
            -backend-config="storage_account=${{ steps.setup_backend.outputs.storage }}" \
            -backend-config="container=${{ steps.setup_backend.outputs.container }}" \
            -backend-config="key=terraform.tfstate"

      - name: Terraform Plan
        run: terraform plan -input=false

      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false

